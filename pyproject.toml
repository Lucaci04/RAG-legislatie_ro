[project]
name = "legislatie-rag"
version = "0.1.0"
description = "Asistent RAG care răspunde la întrebări despre legislația românească, cu citarea articolelor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.5.9",
    "lxml>=5.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32",
    "sentence-transformers>=6.1.0",
    "snowballstemmer>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legislatie_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
